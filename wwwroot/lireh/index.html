<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lire .h — Utils.Colas</title>
  <link rel="stylesheet" href="../common/banner.css">
  <style>
    html, body { margin: 0; font-family: Helvetica, Arial, sans-serif; background: #f5f6f8; color: #111; }
    @media (max-width: 768px) { main { padding: 10px; } select, input { min-width: 0; width: 100%; } .field { flex: 1 1 100%; } }
    @media (max-width: 420px) { button { width: 100%; } }
    main { max-width: 1300px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border: 1px solid #d9dfe3; border-radius: 6px; padding: 14px 16px; margin-bottom: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: bold; }
    select, input { font-size: 13px; padding: 6px 8px; border: 1px solid #bbb; border-radius: 4px; min-width: 180px; }
    input { text-transform: uppercase; }
    button { font-size: 13px; padding: 7px 18px; border-radius: 4px; border: 1px solid #003366; background: #003366; color: #fff; cursor: pointer; font-weight: bold; }
    button.sec { background: #fff; color: #003366; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #status { display: none; padding: 9px 12px; border-radius: 4px; margin-bottom: 14px; white-space: pre-wrap; font-size: 13px; }
    #status.info { display: block; background: #e8f1fb; border: 1px solid #b7d3ee; }
    #status.ok { display: block; background: #e8f6ec; border: 1px solid #b9e0c3; }
    #status.err { display: block; background: #fdecea; border: 1px solid #f3c0bb; color: #a01b12; }
    #result { display: none; }
    pre { margin: 10px 0 0; padding: 12px; background: #1e1e1e; color: #d8d8d8; border-radius: 4px; font: 12.5px/1.45 Consolas, 'Courier New', monospace; overflow: auto; max-height: 65vh; }
    #treeBox { margin-top: 10px; font-size: 13px; }
    #treeBox > summary { cursor: pointer; font-weight: bold; color: #003366; }
    #tree { margin-top: 6px; max-height: 40vh; overflow: auto; border: 1px solid #e3e7ea; border-radius: 4px; padding: 6px 10px; background: #fafbfc; }
    #tree details { margin-left: 14px; }
    #tree summary { cursor: pointer; }
    #tree ul { list-style: none; margin: 2px 0 2px 14px; padding: 0; }
    #tree a { color: #003366; text-decoration: none; }
    #tree a:hover { text-decoration: underline; }
    #tree a.sel { font-weight: bold; background: #fff3c4; }
    #tree small { color: #777; margin-left: 6px; }
  </style>
</head>
<body data-utility="lireh">
  <div id="bandeau-placeholder"></div>

  <main>
    <div class="card">
      <div class="row">
        <label class="field">Environnement
          <select id="env">
            <option value="" disabled selected>Chargement…</option>
          </select>
        </label>
        <label class="field">Nom de l'objet JDE
          <input id="obj" list="recent" maxlength="10" placeholder="ex. F58CB004" autocomplete="off" spellcheck="false">
          <datalist id="recent"></datalist>
        </label>
        <button id="btnRead" type="button">Afficher le .h</button>
        <button id="btnDl" class="sec" type="button">Télécharger le .h</button>
        <button id="btnZip" class="sec" type="button">Télécharger le .zip</button>
      </div>
    </div>

    <div id="status"></div>

    <div class="card" id="result">
      <div id="meta"></div>
      <details id="treeBox"><summary id="treeTitle">Fichiers de l'archive</summary><div id="tree"></div></details>
      <pre id="code"></pre>
    </div>
  </main>

  <footer id="version"></footer>

  <script src="../common/banner.js"></script>
  <script>
    window.addEventListener('error', function (e) {
      var s = document.getElementById('status');
      s.className = 'err'; s.textContent = 'Erreur JS : ' + e.message;
    });
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var env = $('env'), obj = $('obj'), st = $('status');
      // API Utils.Colas (racine calculée par common/banner.js, fonctionne sous un sous-chemin IIS).
      var API = window.UtilsColas.api('api/lireh/');

      function asJson(r) {
        var type = r.headers.get('content-type') || '';
        if (!r.ok || type.indexOf('json') < 0) {
          throw new Error('API introuvable (' + r.status + ') sur ' + r.url + ' — la page doit être servie par Utils.Colas.');
        }
        return r.json();
      }

      function status(kind, msg) { st.className = kind || ''; st.textContent = msg || ''; }
      function busy(b) { $('btnRead').disabled = b; $('btnDl').disabled = b; $('btnZip').disabled = b; }

      var RECENT_KEY = 'utils-colas.lireh.recent';
      function loadRecent() {
        try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch (e) { return []; }
      }
      function renderRecent() {
        var dl = $('recent'); dl.innerHTML = '';
        loadRecent().forEach(function (v) {
          var o = document.createElement('option'); o.value = v; dl.appendChild(o);
        });
      }
      function remember(name) {
        var list = loadRecent().filter(function (v) { return v !== name; });
        list.unshift(name);
        try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 15))); } catch (e) {}
        renderRecent();
      }
      renderRecent();

      function objectName() {
        var v = obj.value.trim().toUpperCase();
        if (v.slice(-2) === '.H') v = v.slice(0, -2);
        if (!/^[A-Z0-9_$]{1,10}$/.test(v)) { status('err', "Nom d'objet JDE invalide."); obj.focus(); return null; }
        obj.value = v;
        return v;
      }

      function url(name, mode, path) {
        return API + 'header?env=' + encodeURIComponent(env.value) + '&objet=' + encodeURIComponent(name) + '&mode=' + mode +
          (path ? '&path=' + encodeURIComponent(path) : '');
      }

      function opts() { return { cache: 'no-store' }; }

      async function errorText(res) {
        var b = await res.json().catch(function () { return null; });
        return { text: (b && (b.detail || b.error)) || ('HTTP ' + res.status), files: b && b.files };
      }

      // Fichier affiché (pour que « Télécharger le .h » reprenne le fichier choisi dans l'arborescence).
      var shown = null;
      function shownPath(name) { return shown && shown.env === env.value && shown.name === name ? shown.path : null; }

      var RULES = {
        'include64': 'include64 : ',
        'source': "Pas de include64/<objet>.h — fichier source : ",
        'specs.zip': 'Pas de fichier .h / .c — spec trouvée dans specs.zip : ',
        'choix': 'Fichier choisi : '
      };

      function formatSize(n) { return n < 1024 ? n + ' o' : n < 1048576 ? (n / 1024).toFixed(1) + ' Ko' : (n / 1048576).toFixed(1) + ' Mo'; }

      // Arborescence des fichiers du zip (les zip imbriqués, ex. specs.zip, apparaissent comme des dossiers).
      function renderTree(files, selected, name) {
        var root = { dirs: {}, files: [] };
        files.forEach(function (f) {
          var parts = f.path.split('/'), node = root;
          for (var i = 0; i < parts.length - 1; i++) {
            node = node.dirs[parts[i]] || (node.dirs[parts[i]] = { dirs: {}, files: [] });
          }
          node.files.push({ name: parts[parts.length - 1], path: f.path, size: f.size });
        });
        function build(node, container, prefix, depth) {
          Object.keys(node.dirs).sort().forEach(function (d) {
            var full = prefix + d + '/';
            var det = document.createElement('details');
            det.open = depth < 1 || (selected && selected.indexOf(full) === 0);
            var sum = document.createElement('summary');
            sum.textContent = (/\.zip$/i.test(d) ? '🗜 ' : '📁 ') + d;
            det.appendChild(sum);
            build(node.dirs[d], det, full, depth + 1);
            container.appendChild(det);
          });
          if (node.files.length) {
            var ul = document.createElement('ul');
            node.files.sort(function (a, b) { return a.name.localeCompare(b.name); }).forEach(function (f) {
              var li = document.createElement('li'), a = document.createElement('a'), s = document.createElement('small');
              a.href = '#'; a.textContent = f.name; a.title = f.path;
              if (f.path === selected) a.className = 'sel';
              a.addEventListener('click', function (e) { e.preventDefault(); obj.value = name; read(f.path); });
              s.textContent = formatSize(f.size);
              li.appendChild(a); li.appendChild(s); ul.appendChild(li);
            });
            container.appendChild(ul);
          }
        }
        var tree = $('tree');
        tree.innerHTML = '';
        build(root, tree, '', 0);
        $('treeTitle').textContent = "Fichiers de l'archive " + name + '.zip (' + files.length + ')';
      }

      async function read(path) {
        var name = objectName(); if (!name) return;
        busy(true); status('info', 'Lecture de ' + name + (path ? ' — ' + path : '') + '…');
        try {
          var res = await fetch(url(name, 'read', path), opts());
          if (!res.ok) {
            var err = await errorText(res);
            status('err', err.text);
            if (err.files) { renderTree(err.files, null, name); $('code').style.display = 'none'; $('treeBox').open = true; $('result').style.display = 'block'; }
            else $('result').style.display = 'none';
            return;
          }
          var b = await res.json();
          remember(b.objectName);
          shown = { env: env.value, name: b.objectName, path: b.path };
          renderTree(b.files || [], b.path, b.objectName);
          $('result').style.display = 'block';
          if (!b.path) {
            $('meta').textContent = b.objectName + ' — ' + b.env + ' (' + b.schema + '.F98780R) — ' + b.files.length + ' fichier(s)';
            $('code').style.display = 'none';
            $('treeBox').open = true;
            status('info', b.message);
            return;
          }
          $('treeBox').open = b.rule === 'choix';
          $('code').style.display = '';
          $('code').textContent = b.header;
          $('meta').textContent = b.path + ' — ' + b.env + ' (' + b.schema + '.F98780R) — ' +
            (b.binary ? 'fichier binaire de ' + formatSize(b.size) + ' (aperçu hexadécimal)' : b.length + ' caractères');
          status('ok', (RULES[b.rule] || '') + b.path);
        } catch (e) { status('err', e.message); } finally { busy(false); }
      }

      async function download(mode, ext) {
        var name = objectName(); if (!name) return;
        var path = mode === 'download' ? shownPath(name) : null;
        busy(true); status('info', 'Préparation de ' + name + ext + '…');
        try {
          var res = await fetch(url(name, mode, path), opts());
          if (!res.ok) {
            var err = await errorText(res);
            status('err', err.text);
            if (err.files) { renderTree(err.files, null, name); $('code').style.display = 'none'; $('treeBox').open = true; $('result').style.display = 'block'; }
            return;
          }
          var cd = res.headers.get('content-disposition') || '';
          var m = /filename\*=UTF-8''([^;]+)/i.exec(cd) || /filename="?([^";]+)"?/i.exec(cd);
          var fileName = m ? decodeURIComponent(m[1]) : name + ext;
          var link = document.createElement('a');
          link.href = URL.createObjectURL(await res.blob());
          link.download = fileName;
          document.body.appendChild(link); link.click(); link.remove();
          setTimeout(function () { URL.revokeObjectURL(link.href); }, 1500);
          remember(name);
          status('ok', 'Téléchargement de ' + fileName + ' lancé.');
        } catch (e) { status('err', e.message); } finally { busy(false); }
      }

      $('btnRead').addEventListener('click', function () { read(); });
      $('btnDl').addEventListener('click', function () { download('download', '.h'); });
      $('btnZip').addEventListener('click', function () { download('zip', '.zip'); });
      obj.addEventListener('keydown', function (e) { if (e.key === 'Enter') read(); });

      // Liste et couleurs issues de OracleConnections (appsettings.json) : aucune valeur codée en dur.
      var COLORS = {};
      function applyColor() { window.UtilsColas.setBannerColor(COLORS[env.value] || '#003366'); }
      env.addEventListener('change', applyColor);

      fetch(API + 'environments', { cache: 'no-store' }).then(asJson).then(function (list) {
        env.innerHTML = '';
        if (!Array.isArray(list) || list.length === 0) { status('err', 'Aucune connexion Oracle configurée.'); return; }
        list.forEach(function (e) {
          if (e.bannerColor) COLORS[e.code] = window.UtilsColas.colorOf(e.bannerColor);
          var o = document.createElement('option');
          o.value = e.code;
          o.textContent = (e.code === e.schema ? e.code : e.code + ' — ' + e.schema) + (e.available ? '' : ' (identifiants manquants)');
          o.disabled = !e.available;
          env.appendChild(o);
        });
        var first = Array.prototype.find.call(env.options, function (o) { return !o.disabled; });
        if (first) env.value = first.value;
        applyColor();
      }).catch(function (e) { status('err', 'Environnements indisponibles : ' + e.message); });
    })();
  </script>
</body>
</html>
